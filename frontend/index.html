<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#598556">
  <title>SAGE | AI Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/upgrades.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand"><img src="/assets/sage-logo.png" alt="SAGE logo"><div class="brand-copy"><strong>SAGE</strong><span>Your AI Study Assistant</span></div><button class="collapse-btn" id="left-collapse" aria-label="Collapse navigation" aria-expanded="true">‹</button></div>
      <button class="new-chat" id="new-chat"><span>+</span><b>New Chat</b></button>
      <nav class="nav-list">
        <button class="nav-item active" data-view="explore" title="Explore"><span>⌂</span><b>Explore</b></button>
        <button class="nav-item" data-view="templates" title="Templates"><span>▧</span><b>Templates</b></button>
        <button class="nav-item" data-view="notes" title="Notes"><span>▤</span><b>Notes</b></button>
        <button class="nav-item" data-view="study" title="Study Plan"><span>◫</span><b>Study Plan</b></button>
        <button class="nav-item" data-view="uploads" title="Uploads"><span>↥</span><b>Uploads</b></button>
        <button class="nav-item" data-view="memory" title="Memory"><span>✦</span><b>Memory</b></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <button class="nav-item" id="theme-toggle" title="Toggle theme"><span>◐</span><b id="theme-label">Dark mode</b></button>
      <button class="nav-item" data-view="settings" title="Settings"><span>⚙</span><b>Settings</b></button>
      <button class="profile" data-view="profile" title="Student profile"><span class="avatar">S</span><span class="profile-copy"><strong>Student</strong><small>Personal workspace</small></span><i></i></button>
    </aside>

    <main class="main-panel">
      <header class="topbar"><button class="icon-btn mobile-only" id="mobile-menu" aria-label="Open navigation">☰</button><div class="mobile-brand"><img src="/assets/sage-logo.png" alt="SAGE logo"> SAGE</div><div class="top-actions"><button class="text-btn" id="share-btn">↗ Share</button><button class="icon-btn" id="bookmark-btn" aria-label="Bookmark conversation">♡</button><button class="icon-btn" id="right-toggle" aria-label="Toggle history">☷</button></div></header>
      <section class="view chat-view" id="view-chat">
        <div class="conversation-head"><div><p class="eyebrow">STUDY SESSION</p><h1 id="conversation-title">New Chat</h1></div><span class="online"><i></i> SAGE is ready</span></div>
        <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Conversation messages"></div>
        <div class="welcome" id="welcome"><img class="welcome-logo" src="/assets/sage-logo.png" alt="SAGE"><h2>How can I help you study today?</h2><p>Explain, plan, calculate, quiz, or organize your learning.</p><div class="suggestions"><button data-prompt="Explain a concept with an example">Explain a concept</button><button data-prompt="Create a 7 day study plan">Create a study plan</button><button data-prompt="Generate a quiz for me">Generate a quiz</button><button data-prompt="Search my uploaded notes">Ask my documents</button></div></div>
        <div class="composer-wrap"><div class="tool-row"><button data-tool="Explain this simply: ">✧ Explain</button><button data-tool="Search the web for: ">⌕ Web search</button><button data-tool="Analyze this code: ">&lt;/&gt; Code</button><button data-tool="Create a quiz for: ">▣ Quiz</button></div><div class="chat-attachments" id="chat-attachments" hidden></div><div id="chat-status" class="chat-status" role="alert" aria-live="assertive" hidden></div><form class="composer" id="composer"><button type="button" class="icon-btn" id="attach-btn" aria-label="Attach a file" title="Attach a file">📎</button><textarea id="message-input" rows="1" placeholder="Ask SAGE anything..." aria-label="Message SAGE"></textarea><button type="button" class="icon-btn" id="stop-btn" aria-label="Stop generating" hidden>■</button><button class="send-btn" type="submit" aria-label="Send message">↑</button></form><input type="file" id="file-input" accept=".pdf,.docx,.txt,.md,.csv,.py" hidden><p class="composer-note">Enter to send · Shift + Enter for a new line · Ctrl + K for a new chat</p></div>
      </section>
      <section class="view workspace-view" id="view-workspace" hidden></section>
    </main>

    <aside class="history-panel" id="history-panel" aria-label="Conversation history"><div class="history-head"><div><p class="eyebrow">YOUR SPACE</p><h2>History</h2></div><button class="icon-btn" id="history-collapse" aria-label="Close history">›</button></div><label class="search-box"><span>⌕</span><input id="history-search" type="search" placeholder="Search conversations..." aria-label="Search conversations"></label><div class="history-list" id="history-list"></div><div class="history-footer"><span id="history-count">0 conversations</span><button id="clear-history">Delete all</button></div></aside>
  </div>
  <div class="mobile-scrim" id="mobile-scrim"></div><div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
  <script src="/upgrades.js"></script>
</body>
</html>
